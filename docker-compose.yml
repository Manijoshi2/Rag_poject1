services:
  api:
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    build:
      context: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment: 
      TRANSCRIBER_URL: "http://transcriber:5000"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "Test@1122"
    depends_on:
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
    restart: unless-stopped

  transcriber:
    build:
      context: ./transcriber
    ports:
      - "5000:5000"
    volumes:
      - whisper_cache:/root/.cache/huggingface
    restart: unless-stopped

  neo4j: 
    image: neo4j:5-community
    ports: 
      - "7474:7474"
      - "8687:7687"
    environment:
      - NEO4J_AUTH=neo4j/Test@1122
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  qdrant:
    image:  qdrant/qdrant:latest
    ports: 
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes: 
  qdrant_data:
  whisper_cache:
  neo4j_data:
